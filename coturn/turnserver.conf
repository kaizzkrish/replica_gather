# coturn config for replica_gather's explicit call feature (audio + screen
# share). This is the TURN fallback used only when two peers can't reach each
# other directly (restrictive NAT/corporate firewall) — most direct-P2P calls
# never touch this server at all, so it stays cheap to run.
#
# Before deploying, replace EVERY value below marked CHANGE-ME, and make sure
# TURN_SECRET here matches the server's .env TURN_SECRET exactly — the
# server's /api/turn-credentials endpoint and this file sign/verify
# credentials with the same shared secret.

listening-port=3478
tls-listening-port=5349

# Time-limited credentials only (see server/src/index.ts's
# /api/turn-credentials) — no static username/password is ever accepted.
use-auth-secret
static-auth-secret=CHANGE-ME-same-value-as-server-env-TURN_SECRET

# CHANGE-ME: your server's actual public IP or domain.
realm=CHANGE-ME-your-domain-or-ip

# Relay port range — keep this open in your firewall/security group.
min-port=49152
max-port=65535

# Don't relay to/from obviously-internal addresses (basic abuse hardening).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

no-cli
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600
