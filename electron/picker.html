<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Share your screen</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #2b2d31;
        color: #f2f3f5;
        font-family: -apple-system, 'Segoe UI', Inter, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    header {
        padding: 16px 20px 8px;
        flex-shrink: 0;
    }
    h1 {
        margin: 0 0 4px;
        font-size: 16px;
    }
    .section-label {
        margin: 12px 20px 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #949ba4;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 0 20px;
    }
    .tile {
        background: #1e1f22;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        text-align: center;
        transition: border-color 0.1s ease, background 0.1s ease;
    }
    .tile:hover {
        border-color: #5865f2;
        background: #26282c;
    }
    .tile img {
        width: 100%;
        height: 100px;
        object-fit: contain;
        background: #111214;
        border-radius: 4px;
        display: block;
    }
    .tile .name {
        margin-top: 6px;
        font-size: 12px;
        color: #dbdee1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .scroll {
        overflow-y: auto;
        flex: 1;
        padding-bottom: 16px;
    }
    footer {
        flex-shrink: 0;
        padding: 12px 20px;
        border-top: 1px solid #1e1f22;
        text-align: right;
    }
    button {
        background: #4e5058;
        color: #f2f3f5;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover {
        background: #6d6f78;
    }
</style>
</head>
<body>
    <header><h1>Share your screen or a window</h1></header>
    <div class="scroll">
        <div id="screens-label" class="section-label" style="display:none">Screens</div>
        <div id="screens" class="grid"></div>
        <div id="windows-label" class="section-label" style="display:none">Windows</div>
        <div id="windows" class="grid"></div>
    </div>
    <footer><button id="cancel">Cancel</button></footer>

    <script>
        document.getElementById('cancel').addEventListener('click', () => window.picker.cancel());

        window.picker.onSources((sources) => {
            const screens = sources.filter((s) => s.id.startsWith('screen:'));
            const windows = sources.filter((s) => s.id.startsWith('window:'));

            const render = (list, containerId, labelId) => {
                const container = document.getElementById(containerId);
                const label = document.getElementById(labelId);
                if (list.length === 0) return;
                label.style.display = 'block';
                list.forEach((source) => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.innerHTML = `<img src="${source.thumbnail}" alt="" /><div class="name">${source.name}</div>`;
                    tile.addEventListener('click', () => window.picker.select(source.id));
                    container.appendChild(tile);
                });
            };

            render(screens, 'screens', 'screens-label');
            render(windows, 'windows', 'windows-label');
        });
    </script>
</body>
</html>
